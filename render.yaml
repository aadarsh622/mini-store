# Render Blueprint — deploy the Mini Store API
# Docs: https://render.com/docs/blueprint-spec
# Connect this repo on Render and set Root Directory to "." (repo root),
# or create a Web Service with Root Directory = backend and ignore this file's paths.

services:
  - type: web
    name: mini-store-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: BCRYPT_SALT_ROUNDS
        value: "10"
      - key: CLIENT_URL
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: Mini Store <onboarding@resend.dev>
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_FILE_SIZE_MB
        value: "5"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: PHONEPE_BASE_URL
        value: https://api-preprod.phonepe.com
      - key: PHONEPE_CLIENT_ID
        value: TEST
      - key: PHONEPE_CLIENT_VERSION
        value: "1"
      - key: PHONEPE_SALT_KEY
        value: TEST_SALT
      - key: PHONEPE_MERCHANT_ID
        value: TEST_MERCHANT
